# Builds the Expo web export and publishes it to GitHub Pages.
#
# Runs on every push to main, and can be triggered manually from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web bundle
        env:
          # Project Pages are served from https://<user>.github.io/<repo>/
          GH_PAGES_BASE_URL: /${{ github.event.repository.name }}
          CI: '1'
        run: npx expo export --platform web --output-dir dist

      # GitHub Pages runs Jekyll unless told otherwise, which drops folders
      # beginning with an underscore — precisely what Expo emits (_expo/).
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      # SPA fallback: any unknown path should load the app shell.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
